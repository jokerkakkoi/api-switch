name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: api-switch-macos-amd64
            binary_name: api-switch
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: api-switch-macos-arm64
            binary_name: api-switch
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: api-switch-linux-amd64
            binary_name: api-switch
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: api-switch-windows-amd64
            binary_name: api-switch.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          cp config.yaml.example dist/
          cp release-readme.md dist/README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package release archives
        run: |
          mkdir -p release

          # macOS AMD64
          cd artifacts/api-switch-macos-amd64
          chmod +x api-switch
          tar czf ../../release/api-switch-v${{ steps.version.outputs.version }}-macos-amd64.tar.gz *
          cd ../..

          # macOS ARM64
          cd artifacts/api-switch-macos-arm64
          chmod +x api-switch
          tar czf ../../release/api-switch-v${{ steps.version.outputs.version }}-macos-arm64.tar.gz *
          cd ../..

          # Linux AMD64
          cd artifacts/api-switch-linux-amd64
          chmod +x api-switch
          tar czf ../../release/api-switch-v${{ steps.version.outputs.version }}-linux-amd64.tar.gz *
          cd ../..

          # Windows AMD64
          cd artifacts/api-switch-windows-amd64
          zip -r ../../release/api-switch-v${{ steps.version.outputs.version }}-windows-amd64.zip *
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## api-switch v${{ steps.version.outputs.version }}

            ### 下载说明

            | 平台 | 架构 | 文件 |
            |------|------|------|
            | macOS | Intel (x86_64) | `api-switch-v${{ steps.version.outputs.version }}-macos-amd64.tar.gz` |
            | macOS | Apple Silicon (ARM64) | `api-switch-v${{ steps.version.outputs.version }}-macos-arm64.tar.gz` |
            | Linux | x86_64 | `api-switch-v${{ steps.version.outputs.version }}-linux-amd64.tar.gz` |
            | Windows | x86_64 | `api-switch-v${{ steps.version.outputs.version }}-windows-amd64.zip` |

            ### 使用方法

            1. 下载对应平台的压缩包并解压
            2. 将 `config.yaml.example` 复制为 `config.yaml` 并修改配置
            3. 运行 `api-switch`（Windows 下运行 `api-switch.exe`）

            详细说明请参考压缩包内的 `README.md`。
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
